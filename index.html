<style>
:root{--p:#0B4F3C;--pd:#083A2C;--g:#B98A2E;--bg:#F6F3EC;--sf:#fff;--ink:#14201B;--mut:#66736C;--ln:#E7E1D3;--soft:#EFEADD;--r:12px;--sh:0 1px 2px rgba(20,32,27,.06),0 6px 20px rgba(20,32,27,.04)}
@media(prefers-color-scheme:dark){:root{--p:#1F8F6E;--pd:#0C1512;--bg:#0C1512;--sf:#121E19;--ink:#ECE7DA;--mut:#8FA097;--ln:#22362E;--soft:#182720}}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;display:grid;grid-template-columns:264px 1fr;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside{background:var(--pd);color:#EDE6D3;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;gap:6px}
@media(prefers-color-scheme:dark){aside{border-inline-end:1px solid var(--ln)}}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px}
.brand img{width:46px;height:46px;border-radius:50%}.brand b{display:block;font-weight:700;font-size:15px;line-height:1.3}.brand span{font-size:12px;color:#CDB77C}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:#CFD8D3;cursor:pointer;font-weight:500;text-align:start;width:100%}
.nv:hover{background:rgba(255,255,255,.06)}.nv[aria-current=true]{background:rgba(185,138,46,.18);color:#fff}.nv[aria-current=true] .i{color:var(--g)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);font-size:13px}
.av{width:32px;height:32px;border-radius:50%;background:var(--g);color:#1a1405;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
main{min-width:0;padding:0 32px 40px;max-width:1040px;width:100%}
.top{position:sticky;top:0;background:var(--bg);z-index:4;padding:22px 0 12px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.2px}.top p{color:var(--mut);font-size:13px}
.seg{display:flex;background:var(--soft);padding:3px;border-radius:10px;gap:2px;overflow-x:auto;margin-inline-start:auto}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--mut);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:var(--sh);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 18px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat b{font-size:26px;font-weight:700;display:block;line-height:1.2}.stat span{color:var(--mut);font-size:13px}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--p);transition:width .4s}
.tl{display:grid;gap:10px}
.it{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.tm{padding-top:14px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;text-align:end}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cd h3{font-size:16px;font-weight:600}.gw{flex:1;min-width:200px}
.ch{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--mut);font-weight:500;margin:6px 6px 0 0}
.ch.k{background:rgba(185,138,46,.16);color:#8A6410}@media(prefers-color-scheme:dark){.ch.k{color:#E0B65A}}
.pill{border:0;border-radius:99px;padding:5px 14px;font-weight:600;font-size:13px;cursor:pointer;background:rgba(var(--c),.15);color:rgb(var(--c))}
.s-todo{--c:102,115,108}.s-doing{--c:185,138,46}.s-done{--c:24,130,98}.s-posted{--c:112,90,180}.s-open{--c:192,100,60}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.btn.o{background:none;color:var(--ink);border:1px solid var(--ln)}.lk{background:none;border:0;color:var(--p);font-weight:600;cursor:pointer;padding:2px 8px}
@media(prefers-color-scheme:dark){.lk{color:#5DD3A9}}
input,select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(185,138,46,.5);border-color:var(--g)}
textarea{width:100%;min-height:72px;resize:vertical}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.st{display:grid;gap:12px;margin-top:14px}
.rp{border-inline-start:2px solid var(--ln);padding:2px 12px;margin-top:8px;font-size:14px}.mt{color:var(--mut);font-size:13px}
.em{text-align:center;color:var(--mut);padding:40px 10px;border:1px dashed var(--ln);border-radius:var(--r)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(8,30,23,.8);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:30;padding:16px}.ov .pn{max-width:400px;width:100%;text-align:center}
.tt{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--pd);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90%}.tt.on{opacity:1;transform:translateX(-50%)}
.bn{display:none}
@media(max-width:820px){body{grid-template-columns:1fr}aside{display:none}main{padding:0 16px 110px}.top h1{font-size:22px}.seg{margin:0;width:100%}.stats{gap:8px}.stat{padding:10px 12px}.stat b{font-size:20px}.it{grid-template-columns:1fr;gap:2px}.tm{text-align:start;padding:0}
.bn{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.bn .nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;color:var(--mut);justify-content:center;align-items:center}.bn .nv[aria-current=true]{background:none;color:var(--p)}.bn .nv[aria-current=true] .i{color:var(--p)}}
</style>

<script>
/* ===== الإعدادات: عدّل هذا الجزء فقط ===== */
const C={
 api:"",   // رابط Google Apps Script (Web app)
 tg:"https://t.me/+Zhur11TBS5s2ZDhk"
};
/* ======================================= */
const $=i=>document.getElementById(i),h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(!C.api){document.body.innerHTML='<div style="max-width:520px;margin:12vh auto;padding:24px;font-family:sans-serif;direction:rtl"><h2>الإعداد مطلوب</h2><p>ضع رابط Apps Script في C.api داخل index.html ثم أعد النشر. التفاصيل في README.md</p></div>';throw 0}
const DAYS=[21,22,23,24,25],CAT=['فيديو','صور','ريل','ستوري','مقابلات','بودكاست','ورشة'];
const STY=['عمودي 9:16 · محمول سريع','عمودي 9:16 · حامل ثابت','أفقي 16:9 · رسمي بحامل','مقابلة · صدر وخلفية المهرجان','لقطات سينمائية بطيئة','توثيقي عفوي (كواليس)'];

const NAMES=['Ben Wis','بن بختي ملاك ليلى','طبال شيماء','أنس','رزق الله','المسعود يوسف','تويقر مروان','درار كنزة','سلطاني أميرة','رضوان','فندي نوفل','مسعودي إيهاب','أمينة','غزلان ختير','وحيد','شريفة أمينة ميلودي','قدراوي مروى','محمد احميمة','شيماء','ملاك'];
const SL=[['todo','لم يبدأ'],['doing','جاري'],['done','تم'],['posted','نُشر']];
const SEED=[['09:00','فيديو','فيديو خاص بالأعضاء المنظمين','',STY[0]],['09:30','صور','صور الأعضاء المنظمين','درار كنزة',STY[5]],['11:00','فيديو','فيديو رسمي لوصول الوفود','المسعود يوسف',STY[2]],['14:00','مقابلات','آراء المنظمين (مقابلات قصيرة)','فندي نوفل',STY[3]],['15:00','ستوري','ستوريات اليوم','',STY[0]],['20:00','ريل','ريل شامل لليوم','سلطاني أميرة',STY[1]]];
const TABS=[['prog','البرنامج','برنامج التغطية','المهام والأنماط لكل يوم'],['posts','النقاش','منتدى الفريق','نقاش وأفكار'],['needs','الاحتياجات','الاحتياجات','اطلب شخصاً أو جهازاً ويصل إشعار للجميع'],['equip','العتاد','العتاد المتوفر','ما يملكه كل عضو'],['admin','الإدارة','لوحة الإدارة','إدارة الورشات والمهام']];
const S={program:[],status:[],equip:[],posts:[],members:[]};
let tab='prog',day=DAYS.includes(new Date().getDate())?new Date().getDate():21,me=localStorage.getItem('me')||'',admin=false,editId=null,first={};const RP={posts:'',needs:''};
const uid=localStorage.getItem('uid')||(()=>{const v='u'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('uid',v);return v})(),user={uid};let pin=localStorage.getItem('pin')||'',busy=0;
async function api(b){try{const r=await fetch(C.api,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...b,pin,uid})});return await r.json()}catch(e){toast('تعذّر الاتصال بالخادم');return{ok:0}}}
async function poll(){if(busy)return;busy=1;try{const r=await(await fetch(C.api+'?a=all')).json();if(r&&r.program){if(first.posts)r.posts.forEach(v=>{if(v.uid!==uid&&!S.posts.some(x=>x.id===v.id))local(v.type==='need'?'احتياج جديد':'رسالة جديدة',v.name+': '+v.text)});first.posts=1;['program','status','equip','posts','members'].forEach(c=>S[c]=r[c]);render()}}catch(e){}busy=0}
const ic=n=>'<svg class="i"><use href="#i-'+n+'"/></svg>',opt=(a,p)=>(p?'<option value="">'+p+'</option>':'')+a.map(x=>'<option>'+h(x)+'</option>').join('');
const ago=t=>new Date(t).toLocaleString('ar-DZ',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

const add=async(c,d,id)=>{id=id||'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const row={...d,id},i=S[c].findIndex(x=>x.id===id);i<0?S[c].push(row):S[c][i]=row;render();const r=await api({a:'set',c,id,d});if(!r.ok)toast(r.err==='pin'?'صلاحية المسؤول مطلوبة':'تعذّر الحفظ');poll()};
const del=async(c,id)=>{S[c]=S[c].filter(x=>x.id!==id);render();const r=await api({a:'del',c,id});if(!r.ok)toast('تعذّر الحذف');poll()};
const stOf=id=>(S.status.find(x=>x.id===id)||{}).s||'todo';
function local(t,b){toast(t+': '+b.slice(0,60));try{if(Notification.permission==='granted')navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png',dir:'rtl'}))}catch(e){}}

function nav(){const html=tabs().map(t=>'<button class="nv" data-t="'+t[0]+'" aria-current="'+(t[0]===tab)+'">'+ic(t[0])+t[1]+'</button>').join('');$('sn').innerHTML=html;$('bn').innerHTML=html;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;scrollTo(0,0);render()})}

/* program */
function mine(x){return me&&(x.owner||'').includes(me)}
function drawProg(){const all=S.program.filter(x=>+x.day===day).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')),dn=all.filter(x=>['done','posted'].includes(stOf(x.id))).length;
 $('s1').textContent=all.length;$('s2').textContent=dn;$('s3').textContent=all.filter(mine).length;$('pb').style.width=all.length?Math.round(dn/all.length*100)+'%':'0';
 $('pl').innerHTML=all.length?all.map(x=>{const s=stOf(x.id),l=SL.find(y=>y[0]===s)[1];return'<div class="it"><div class="tm">'+h(x.time||'—')+'</div><div class="cd"><div class="gw"><h3>'+h(x.title)+'</h3><span class="ch">'+h(x.cat||'')+'</span><span class="ch">'+h(x.owner||'يُحدَّد المسؤول')+'</span>'+(x.style?'<span class="ch k">'+h(x.style)+'</span>':'')+(x.note?'<div class="mt" style="margin-top:6px">'+h(x.note)+'</div>':'')+'</div><button class="pill s-'+s+'" data-s="'+h(x.id)+'">'+l+'</button></div></div>'}).join(''):'<div class="em">لا توجد مهام لهذا اليوم بعد.</div>';
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const id=b.dataset.s,i=SL.findIndex(y=>y[0]===stOf(id));add('status',{s:SL[(i+1)%4][0],by:me},id)})}

/* threads */
function thr(type,el){const L=S.posts.filter(x=>x.type===type).sort((a,b)=>a.t-b.t),R=L.filter(x=>!x.p).reverse(),n=type==='need';
 el.innerHTML=R.length?R.map(r=>{const rs=L.filter(x=>x.p===r.id);return'<div class="pn"><div class="row"><div class="av" style="width:28px;height:28px;font-size:12px">'+h(r.name[0])+'</div><b>'+h(r.name)+'</b><span class="mt">'+ago(r.t)+(n&&r.to&&r.to!=='الجميع'?' · إلى: '+h(r.to):'')+'</span>'+(n?'<span class="pill s-'+(r.done?'done':'open')+'" style="margin-inline-start:auto;cursor:default">'+(r.done?'تمت التلبية':'مفتوح')+'</span>':'')+'</div><div style="white-space:pre-wrap;margin-top:8px;font-weight:500">'+h(r.text)+'</div>'+rs.map(p=>'<div class="rp"><b>'+h(p.name)+'</b> <span class="mt">'+ago(p.t)+'</span><div style="white-space:pre-wrap">'+h(p.text)+'</div></div>').join('')+'<div class="row" style="margin-top:8px"><button class="lk" data-rp="'+type+'|'+r.id+'">رد</button>'+(n?'<button class="lk" data-dn="'+r.id+'">'+(r.done?'إعادة فتح':'تمت التلبية')+'</button>':'')+(r.uid===(user&&user.uid)||admin?'<button class="lk" data-dl="'+r.id+'">حذف</button>':'')+'</div></div>'}).join(''):'<div class="em">لا توجد رسائل بعد.</div>';
 el.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{const a=b.dataset.rp.split('|');RP[a[0]==='need'?'needs':'posts']=a[1];lbl();(a[0]==='need'?$('nt'):$('pt')).focus()});
 el.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>del('posts',b.dataset.dl));
 el.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const r=S.posts.find(x=>x.id===b.dataset.dn);r&&add('posts',{...r,done:!r.done},r.id)})}
function lbl(){$('pr1').textContent=RP.posts?'ردّ على رسالة':'';$('pc').hidden=!RP.posts;$('nr1').textContent=RP.needs?'ردّ على احتياج':'';$('nc').hidden=!RP.needs}
$('pc').onclick=()=>{RP.posts='';lbl()};$('nc').onclick=()=>{RP.needs='';lbl()};
$('ps').onclick=()=>{const v=$('pt').value.trim();if(!v)return;add('posts',{type:'forum',name:me,uid:user.uid,text:v,t:Date.now(),p:RP.posts});$('pt').value='';RP.posts='';lbl()};
$('ns').onclick=()=>{const v=$('nt').value.trim();if(!v)return;const to=$('nto').value;add('posts',{type:'need',name:me,uid:user.uid,text:v,t:Date.now(),p:RP.needs,to,done:false});$('nt').value='';RP.needs='';lbl();toast('تم الإرسال وإشعار الفريق')};

/* equipment */
function drawEquip(){const L=S.equip,sum={};L.forEach(x=>sum[x.type]=(sum[x.type]||0)+(+x.qty||1));$('esum').textContent=L.length?'المتوفر: '+Object.keys(sum).map(k=>k+' ×'+sum[k]).join(' · '):'';
 $('el').innerHTML=TYP.map(t=>{const g=L.filter(x=>x.type===t);return g.length?'<div class="pn"><b>'+h(t)+'</b>'+g.map(x=>'<div class="row" style="border-top:1px solid var(--ln);padding:6px 0;margin-top:6px"><span style="flex:1">'+h(x.item||'')+' ×'+h(x.qty||1)+'<div class="mt">'+h(x.name)+'</div></span>'+(x.uid===(user&&user.uid)||admin?'<button class="lk" data-de="'+h(x.id)+'">حذف</button>':'')+'</div>').join('')+'</div>':''}).join('')||'<div class="em">لم يسجّل أحد عتاده بعد.</div>';
 document.querySelectorAll('[data-de]').forEach(b=>b.onclick=()=>del('equip',b.dataset.de))}
$('ea').onclick=()=>{add('equip',{type:$('et').value,item:$('ei').value.trim(),qty:+$('eq').value||1,name:me,uid:user.uid,t:Date.now()});$('ei').value='';toast('تمت الإضافة')};

/* admin */
function drawAdmin(){$('alg').hidden=admin;$('afm').hidden=!admin;if(!admin){$('al').innerHTML='';return}
 const nm=[...new Set(NAMES.concat(S.members.map(m=>m.name)))];$('nl2').innerHTML=nm.map(v=>'<option value="'+h(v)+'">').join('');
 const L=S.program.filter(x=>+x.day===day).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));$('adt').textContent='إدارة برنامج '+day+' أكتوبر';
 $('al').innerHTML=L.map(x=>'<div class="pn"><div class="mt">'+h(x.time||'')+' · '+h(x.cat||'')+'</div><b>'+h(x.title)+'</b><div class="mt">'+h(x.owner||'بدون مسؤول')+' · '+h(x.style||'')+'</div><div class="row"><button class="lk" data-ae="'+h(x.id)+'">تعديل</button><button class="lk" data-ad="'+h(x.id)+'">حذف</button></div></div>').join('')||'<div class="em">لا مهام لهذا اليوم.</div>';
 document.querySelectorAll('[data-ae]').forEach(b=>b.onclick=()=>{const x=S.program.find(y=>y.id===b.dataset.ae);if(!x)return;editId=x.id;$('at').value=x.time||'';$('ati').value=x.title||'';$('ac').value=x.cat||CAT[0];$('ao').value=x.owner||'';$('as').value=x.style||'';$('an').value=x.note||'';$('acl').hidden=false;scrollTo(0,0)});
 document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>del('program',b.dataset.ad))}
const clr=()=>{editId=null;['at','ati','ao','an'].forEach(i=>$(i).value='');$('acl').hidden=true};$('acl').onclick=clr;
$('asv').onclick=()=>{const t=$('ati').value.trim();if(!t){toast('اكتب العنوان');return}add('program',{day,time:$('at').value,title:t,cat:$('ac').value,owner:$('ao').value.trim(),style:$('as').value,note:$('an').value.trim()},editId);clr();toast('تم الحفظ')};
$('sd').onclick=()=>SEED.forEach((s,i)=>add('program',{day:21,time:s[0],cat:s[1],title:s[2],owner:s[3],style:s[4],note:''},'d21-'+(i+1)));
$('agb').onclick=async()=>{pin=$('apin').value.trim();const r=await api({a:'auth'});if(r.ok){localStorage.setItem('pin',pin);admin=true;$('mr').textContent='مسؤول';toast('تم الدخول');render()}else{pin='';toast('الرمز غير صحيح')}};

function render(){nav();const T=TABS.find(t=>t[0]===tab);$('h1').textContent=T[2];$('h2').textContent=T[3];
 TABS.forEach(t=>$(t[0]).hidden=t[0]!==tab);$('days').hidden=!(tab==='prog'||tab==='admin');
 $('days').innerHTML=DAYS.map((d,i)=>'<button aria-pressed="'+(d===day)+'" data-d="'+d+'">اليوم '+(i+1)+' · '+d+'</button>').join('');
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{day=+b.dataset.d;render()});
 if(tab==='prog')drawProg();else if(tab==='posts')thr('forum',$('pls'));else if(tab==='needs')thr('need',$('nls'));else if(tab==='equip')drawEquip();else drawAdmin()}
$('et').innerHTML=opt(TYP);$('nto').innerHTML=opt(TO);$('ac').innerHTML=opt(CAT);$('as').innerHTML=opt(STY,'نمط التصوير');
if(!me)$('ov').hidden=false;else{$('mn').textContent=me;$('av').textContent=me[0]}
render();
(async()=>{if(pin){const r=await api({a:'auth'});admin=!!r.ok;if(!admin){pin='';localStorage.removeItem('pin')}}$('mr').textContent=admin?'مسؤول':'عضو';reg();await poll();setInterval(()=>{if(!document.hidden)poll()},6000);addEventListener('focus',poll)})();
</script>
</body>
</html>
